[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nymbric"
version = "0.1.0"
description = "Open-source adversarial security testing for context-aware AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Nymbric contributors" }]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "networkx>=3.4",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "typer>=0.12",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
nymbric = "nymbric.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
